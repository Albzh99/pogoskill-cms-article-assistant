name: PoGoskill package tests

on:
  push:
  pull_request:

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pillow python-docx
      - name: Python tests
        run: python -m unittest discover -s plugins/pogoskill-cms-assistant/scripts -p 'test_*.py'
      - name: PowerShell product and credential tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./plugins/pogoskill-cms-assistant/scripts/test-product-mapping.ps1
          ./plugins/pogoskill-cms-assistant/scripts/test-cms-credential-fallback.ps1
